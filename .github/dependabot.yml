version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions. Actions are pinned by major tag in the workflows, so this
  # mostly catches majors that need a deliberate migration.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Dart packages. This repo is NOT a pub workspace: every pubspec.yaml resolves
  # independently, so each package directory needs its own entry.
  #
  # Two entries, and there should stay two: this repository is the platform and
  # holds no plugins. The `/plugins/*` entries that used to be here outlived the
  # directories they named.
  # ---------------------------------------------------------------------------
  - package-ecosystem: pub
    directories:
      - "/"                             # swayve_plugin_tools (root tool package)
      - "/packages/swayve_plugin_sdk"   # published SDK — keep dependency-free
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dart
    commit-message:
      prefix: "deps"
    groups:
      dart-dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
