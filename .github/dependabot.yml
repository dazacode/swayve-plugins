version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions. Every `uses:` is pinned to a full commit SHA with the version
  # in a trailing comment, so this is what keeps them current: Dependabot bumps
  # the SHA and the comment together. A mutable tag would need no bumping and
  # give no notice — which is exactly why they are not used here.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # ---------------------------------------------------------------------------
  # Dart packages. This repo is NOT a pub workspace: every pubspec.yaml resolves
  # independently, so each package directory needs its own entry. Add a new
  # directory here whenever a plugin is added under plugins/.
  # ---------------------------------------------------------------------------
  - package-ecosystem: pub
    directories:
      - "/"                             # swayve_plugin_tools (root tool package)
      - "/packages/swayve_plugin_sdk"   # published SDK — keep dependency-free
      - "/packages/swayve_plugin_registry"  # the first-party compiled catalogue
      - "/plugins/example"
      - "/plugins/youtube_music"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dart
    commit-message:
      prefix: "deps"
    groups:
      dart-dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
