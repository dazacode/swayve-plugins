name: swayve_plugin_tools
description: >-
  Validation, packaging and verification tooling for Swayve plugins. Owns the
  published plugin manifest schema and the deterministic .swayveplugin bundle
  format.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  archive: ^3.6.1
  args: ^2.6.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
