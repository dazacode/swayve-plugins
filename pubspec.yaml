name: swayve_plugin_tools
description: >-
  Validation, packaging and verification tooling for Swayve plugins. Owns the
  published plugin manifest schema and the deterministic .swayveplugin bundle
  format.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  archive: ^4.2.0
  args: ^2.6.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  # Path dependency, not git — same reasoning as every other in-repo sibling
  # reference: this is only for a test asserting kManifestSchemaVersion here
  # stays equal to kSwayveManifestSchemaVersion there (see schema_sync_test.dart),
  # not something a published consumer of this package needs.
  swayve_plugin_sdk:
    path: packages/swayve_plugin_sdk
