name: swayve_plugin_registry
description: >
  The list of first-party compiled Swayve plugins, in one place. Host apps
  depend on this package instead of on each compiled plugin individually.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  swayve_plugin_sdk:
    path: ../swayve_plugin_sdk
  soundcloud:
    path: ../../plugins/soundcloud
  youtube_music:
    path: ../../plugins/youtube_music

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
