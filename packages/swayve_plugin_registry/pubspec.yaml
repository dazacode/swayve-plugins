name: swayve_plugin_registry
description: >
  The list of first-party compiled Swayve plugins, in one place. Host apps
  depend on this package instead of on each compiled plugin individually.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  # A git dependency, not `path: ../swayve_plugin_sdk` — even though this
  # package and the SDK are still siblings in the same repository. The
  # plugin catalogue moved out to its own repository, and the plugins there
  # (soundcloud, youtube_music, below) have no local path back to the SDK,
  # so *they* depend on it via git. Pub requires every request for one
  # package, anywhere in a resolution, to agree on a single source — a path
  # dependency and a git dependency to "the same" code are not
  # interchangeable as far as pub's resolver is concerned, however identical
  # their content — so a host app pulling in both this registry and (through
  # it) those plugins would hit an unresolvable conflict if this stayed a
  # path dependency. Matching the plugins' own source here means no host app
  # that depends on this registry ever has to work around that itself; the
  # alternative is every single one of them needing its own
  # `dependency_overrides` to paper over a conflict this package created.
  #
  # The cost is local development convenience: testing an SDK change against
  # this registry in the same uncommitted session now needs a
  # `pubspec_overrides.yaml` (local-only, never committed) rather than
  # working automatically, the way an in-repo path dependency used to. See
  # `docs/development.md`'s "Working on the SDK and an external plugin at
  # once" for that pattern — it already exists for exactly this situation.
  swayve_plugin_sdk:
    git:
      url: https://github.com/dazacode/swayve-plugins.git
      path: packages/swayve_plugin_sdk
      ref: 76645127576611d7248cdd96e06e38b4b39b1584
  # The first-party plugin catalogue now lives in its own repository — see
  # https://github.com/dazacode/Daza-Swayve-plugins — so these are pinned git
  # dependencies too. Pinned by commit, same reasoning as swayve-client's own
  # pin of this repo: a fresh checkout, CI included, always resolves the
  # exact plugin code this registry was last verified against. Kept at the
  # exact same commit as `swayve_plugin_sdk` above, for the reason explained
  # there — both plugins declare that same ref for their own SDK dependency,
  # and any drift between the three is the conflict this whole arrangement
  # exists to avoid.
  soundcloud:
    git:
      url: https://github.com/dazacode/Daza-Swayve-plugins.git
      path: soundcloud
      ref: 904d0afb9303e89547fd0d588ee5743671bd097f
  youtube_music:
    git:
      url: https://github.com/dazacode/Daza-Swayve-plugins.git
      path: youtube_music
      ref: 3330d25804b5fd471c5362bd1b440f2518eebeee

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
